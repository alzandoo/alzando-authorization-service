services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: alzando_authz
      POSTGRES_USER: alzando
      POSTGRES_PASSWORD: alzando_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alzando -d alzando_authz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://alzando:alzando_dev@db:5432/alzando_authz
      CHALLENGE_HMAC_SECRET: ${CHALLENGE_HMAC_SECRET:-}
      PASSWORD_RECOVERY_TTL_SECONDS: ${PASSWORD_RECOVERY_TTL_SECONDS:-300}
      PASSWORD_RECOVERY_RESEND_INTERVAL_SECONDS: ${PASSWORD_RECOVERY_RESEND_INTERVAL_SECONDS:-60}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-600}
      PHONE_VERIFICATION_TTL_SECONDS: ${PHONE_VERIFICATION_TTL_SECONDS:-600}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_RESEND_INTERVAL_SECONDS: ${OTP_RESEND_INTERVAL_SECONDS:-60}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-300}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AUTHENTICATION_GRANT_TTL_SECONDS: ${AUTHENTICATION_GRANT_TTL_SECONDS:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    command: sh -c "alembic upgrade head && uvicorn alzando_authorization.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
